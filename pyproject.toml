[project]
name = "historical-kb-mcp"
version = "1.0.0"
description = "Historical Search Engineering KB MCP — stores and retrieves past defect triage analyses (Rapid7 SI Triage POC)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "numpy>=1.26",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
historical-kb-mcp = "historical_kb_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
